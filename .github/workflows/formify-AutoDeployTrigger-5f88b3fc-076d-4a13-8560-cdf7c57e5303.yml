name: Trigger auto deployment for formify

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/formify-AutoDeployTrigger-5f88b3fc-076d-4a13-8560-cdf7c57e5303.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FORMIFY_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FORMIFY_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FORMIFY_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: ${{ secrets.FORMIFY_REGISTRY_URL }}
          registryUsername: ${{ secrets.FORMIFY_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FORMIFY_REGISTRY_PASSWORD }}
          containerAppName: formify
          resourceGroup: formify
          imageToBuild: ${{ secrets.FORMIFY_REGISTRY_URL }}/formify:${{ github.sha }}


